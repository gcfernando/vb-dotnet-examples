# GitHub Pages documentation site; does not configure application deployment.
url: "https://gcfernando.github.io"
baseurl: "/vb-dotnet-examples"
title: "VB.NET Windows Forms Examples"
description: "Visual Basic Windows Forms learning examples, including a binary clock displaying hours, minutes and seconds."
lang: "en"
plugins:
  - jekyll-sitemap
exclude:
  - packages
  - bin
  - obj
  - node_modules
  - vendor
  - tests
  - .claude
  - .agents
  - .codex
defaults:
  - scope:
      path: "README.md"
    values:
      title: "VB.NET Binary Clock — Windows Forms Example"
      description: "Explore a Visual Basic Windows Forms binary clock, with setup notes for its legacy .NET Framework target, timer behavior and known rendering limitations."

# Public documentation navigation and presentation.
repository: gcfernando/vb-dotnet-examples
theme: jekyll-theme-primer
projects_hub: https://gcfernando.github.io/gcfernando/projects/
project_category: "Learn & desktop"
